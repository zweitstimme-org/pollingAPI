[project]
name = "pollingapi"
version = "1.0.0"
description = "German election polling data API with scrapers and ETL pipeline"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Zweitstimme" }
]
dependencies = [
    # Web Framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.46.0",
    "gunicorn>=21.0.0",  # Production WSGI server
    # Database
    "sqlalchemy>=2.0.44",
    "aiosqlite>=0.20.0",
    "greenlet>=3.5.3",
    # Data Processing
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    # Scraping
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.0",
    # CLI
    "typer>=0.13.0",
    # Date/Time Parsing
    "dateparser>=1.2.0",
    "python-dateutil>=2.9.0",
    # Configuration
    "python-dotenv>=1.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.0",
    # HTTP Client
    "httpx>=0.28.0",
    # S3 Storage
    "boto3>=1.35.0",
    # Utilities
    "toml>=0.10.2",
    "pyarrow>=24.0.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocs-minify-plugin>=0.8.0",
    "openpyxl>=3.1.5",
    "typst>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.12",
    "mypy>=1.13.0",
    "types-requests>=2.33.0.20260712",
    "types-beautifulsoup4>=4.12.0",
    "types-toml>=0.10.8",
]

[project.scripts]
pollingapi = "pollingapi.cli:main"
zweitstimme = "pollingapi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pollingapi"]

[tool.hatch.build.targets.wheel.force-include]
"src/pollingapi/templates/report.typ" = "pollingapi/templates/report.typ"

[tool.uv]
package = true

[tool.uv.pip]
generate-hashes = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "UP006", # Use list instead of List for type annotation
    "UP007", # Use X | Y for type annotations
]

[tool.ruff.lint.isort]
known-first-party = ["pollingapi"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/pollingapi"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
